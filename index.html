<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}body{margin:0}[hidden]{display:none!important}</style>
<title>Voile Chic Creator Board</title>
<meta name="description" content="Voile Chic creator competition: today's leaders and your rank.">
<meta property="og:title" content="Voile Chic Creator Board">
<meta property="og:description" content="Three $20 winners every day. See who is leading and where you rank.">
<meta name="theme-color" content="#151515">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
<style id="css">
/* Layout: one centered column, phone-first. One black-framed card holds the three leaders; everything else is one tap away. Voile Chic store look: white, black, square edges, spaced uppercase Arimo. */
:root{
  --bg:#ffffff; --ink:#151515; --soft:#2d2d2d; --muted:#717171; --line:#dddddd;
  --sand:#f4e9da; --bronze:#715939; --good:#2e7d4f;
  --font:"Arimo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cap{text-transform:uppercase;letter-spacing:.16em;font-weight:700;font-size:12px}
.num{font-variant-numeric:tabular-nums}

.top{background:var(--ink);color:#fff;text-align:center;padding-block:14px}
.top .wm{font-weight:700;letter-spacing:.32em;font-size:17px;text-transform:uppercase;padding-left:.32em}
.top .sub{color:#bdbdbd;margin-top:4px;font-size:11px;letter-spacing:.24em}

.page{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}

.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.head .day{font-size:13px;color:var(--muted)}
.timer{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.timer b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}

.card{border:2px solid var(--ink)}
.card-title{background:var(--ink);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.card-title span:last-child{color:#cfcfcf;font-weight:400;letter-spacing:.08em;text-transform:none;font-size:12px}
.lead{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px;border-top:1px solid var(--line);align-items:end}
.lead:first-of-type{border-top:0}
.lead .what{grid-column:1/-1;display:flex;justify-content:space-between;color:var(--muted)}
.lead .what .prize{color:var(--bronze)}
.lead .who{font-size:24px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.lead .val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lead.none .who{color:#b5b5b5;font-weight:400;font-size:18px}

.find{display:flex;flex-direction:column;gap:8px}
.find input{border:1px solid var(--line);padding:13px 14px;font-size:16px;border-radius:0;background:#fff;width:100%;box-sizing:border-box}
.find input::placeholder{color:#8a8a8a}
.me{background:var(--sand);padding:12px 14px;font-size:15px;line-height:1.5}
.me b{font-weight:700}

.more{border:1px solid var(--ink);background:#fff;padding:13px;cursor:pointer;width:100%}
.more:hover{background:var(--ink);color:#fff}

.detail{display:flex;flex-direction:column;gap:22px}
.list h3{margin:0 0 6px;font-size:12px}
.list ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.list li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.list li .p{color:var(--muted);font-variant-numeric:tabular-nums}
.list li .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li .v{font-weight:700;font-variant-numeric:tabular-nums}
.list li.me-row{background:var(--sand)}
.list .empty{color:var(--muted);font-size:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink);margin-bottom:8px}
.seg button{background:#fff;border:0;border-left:1px solid var(--ink);padding:9px 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:#fff}
.bars{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.bars li{display:flex;flex-direction:column;gap:5px;padding:2px 0}
.bars li.me-row{background:var(--sand);padding:6px 8px;margin:0 -8px}
.bar-top{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.bar-top .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-top .v{font-weight:700;font-variant-numeric:tabular-nums}
.track{height:10px;background:#eeeeee}
.track i{display:block;height:100%;background:var(--ink)}
.bars li:first-child .track i{background:var(--bronze)}
.bars-empty,.bars-me{color:var(--muted);font-size:14px;padding:10px 0}
.past{width:100%;border-collapse:collapse;font-size:14px}
.past th,.past td{text-align:left;padding:9px 6px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.past th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink)}
.scroll{overflow-x:auto}

.rules{font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
.rules b{color:var(--ink)}

/* team controls (admin board only) */
#admin{border-top:2px solid var(--ink);padding-top:18px;display:flex;flex-direction:column;gap:22px}
#admin h2{margin:0;font-size:13px}
.blk{display:flex;flex-direction:column;gap:10px}
.blk p{margin:0;font-size:13px;color:var(--muted)}
.msg{white-space:pre-wrap;background:var(--sand);padding:12px 14px;font-size:14px;line-height:1.55;user-select:all}
.btn{background:var(--soft);color:#fff;border:0;padding:12px 16px;cursor:pointer;border-radius:0}
.btn:hover{background:#000}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px}
.field{border:1px solid var(--line);padding:10px 12px;border-radius:0;background:#fff;min-width:0}
.row .field{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:4px 4px 4px 10px;font-size:13px}
.chip button{border:0;background:#eee;width:22px;height:22px;cursor:pointer}
.hp{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:8px;align-items:center;font-size:14px}
.hp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws{display:flex;flex-direction:column;gap:4px;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tbl td.r,.tbl th.r{text-align:right}
.flag{background:var(--sand);padding:2px 6px;font-size:12px}
.save-msg{font-size:13px;min-height:1.4em;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>

<script id="appjs">
(function(){
var MODE="public"; /* "admin" in the Claude board, "public" on the website */
var PUBLIC_URL="https://tiktok-creator-board.vercel.app";
var TZ="America/New_York";
var state={"version":1,"product":"Instant Premium Jersey Hijab","timezone":"America/New_York","startDate":"2026-11-01","updatedAt":null,"roster":[],"videos":[],"daily":{},"samples":[],"winners":{}};
var ui={period:"day",metric:"sales",open:false,isOwner:false,artifact:null,saving:false,msg:"",find:"",copied:false,hday:null};
try{ui.find=localStorage.getItem("vc_find")||""}catch(e){}
var CATS=[
 {key:"sales",label:"Top sales",emoji:"💰",fmt:money},
 {key:"views",label:"Most views",emoji:"👀",fmt:count},
 {key:"helper",label:"Best helper",emoji:"🤝",fmt:pts}
];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(h){return String(h||"").trim().replace(/^@+/,"").toLowerCase()}
function money(n){var v=Number(n)||0;return "$"+v.toLocaleString("en-US",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})}
function count(n){var v=Number(n)||0;return v>=10000?(v/1000).toFixed(v>=100000?0:1)+"K":v.toLocaleString("en-US")}
function pts(n){var v=Number(n)||0;return v+(v===1?" pt":" pts")}
function parts(d){var o={};new Intl.DateTimeFormat("en-US",{timeZone:TZ,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(d).forEach(function(p){o[p.type]=p.value});return o}
function estDay(d){var p=parts(d);return p.year+"-"+p.month+"-"+p.day}
function compDay(d){return estDay(new Date(d.getTime()-10*3600*1000))} /* a round runs 10am ET to 10am ET and is named by its start date */
function today(){return compDay(new Date())}
function addDay(s,n){var p=s.split("-").map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]+n,12)).toISOString().slice(0,10)}
function fmtDay(s,long){var p=s.split("-").map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2],12)).toLocaleDateString("en-US",long?{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"}:{month:"short",day:"numeric",timeZone:"UTC"})}
function started(){return today()>=state.startDate}
function secsToMidnight(){var p=parts(new Date()),s=+p.hour*3600+ +p.minute*60+ +p.second;return s<36000?36000-s:86400-s+36000}
function secsToStart(){var p=parts(new Date()),a=state.startDate.split("-").map(Number);return Math.max(0,Math.round((Date.UTC(a[0],a[1]-1,a[2],10)-Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second))/1000))}
function hm(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+"h "+(m<10?"0":"")+m+"m"}
function roster(){var s={};(state.roster||[]).forEach(function(r){s[norm(r.handle)]=1});return s}
function closedDays(){var out=[],d=state.startDate,t=today();while(d<t){out.push(d);d=addDay(d,1)}return out}

function scores(cat,day){
  var R=roster(),m={};
  if(cat==="views"){(state.videos||[]).forEach(function(v){var h=norm(v.handle);if(R[h]&&v.postedAt&&compDay(new Date(v.postedAt))===day)m[h]=(m[h]||0)+(Number(v.views)||0)})}
  else{var src=((state.daily||{})[day]||{})[cat]||{};Object.keys(src).forEach(function(k){var h=norm(k);if(R[h])m[h]=(m[h]||0)+(Number(src[k])||0)})}
  return Object.keys(m).filter(function(h){return m[h]>0}).map(function(h){return {h:h,v:m[h]}}).sort(function(a,b){return b.v-a.v||a.h.localeCompare(b.h)});
}
function winner(cat,day){var w=(state.winners||{})[day];if(w&&w[cat]){var h=norm(w[cat]),s=scores(cat,day).filter(function(r){return r.h===h})[0];return {h:h,v:s?s.v:null}}var s2=scores(cat,day);return s2.length?{h:s2[0].h,v:s2[0].v}:null}

function render(){
  var t=today(),live=started(),me=norm(ui.find),R=roster(),past=closedDays().reverse(),yday=past[0];
  var h='<header class="top"><div class="wm">Voile Chic</div><div class="sub cap">Creator competition</div></header><main class="page">';

  // 1. the one thing to look at
  var day=live?t:state.startDate;
  h+='<div class="head"><span class="cap">'+(live?"Today\u2019s round":"Starts")+' · '+esc(fmtDay(day,true))+'</span><span class="timer">'+(live?'<span class="dot"></span>Ends in <b id="tm">'+hm(secsToMidnight())+'</b>':'Starts in <b id="tm">'+hm(secsToStart())+'</b>')+'</span></div>';
  h+='<section class="card" aria-label="Leaders"><div class="card-title cap"><span>'+(live?"Leading now":"Today’s prizes")+'</span><span>$20 each</span></div>';
  CATS.forEach(function(c){var w=live?winner(c.key,day):null;
    h+='<div class="lead'+(w?'':' none')+'"><div class="what cap"><span>'+esc(c.label)+'</span><span class="prize">$20</span></div>'+
       '<div class="who">'+(w?'@'+esc(w.h):(live?'No one yet':'10am ET'))+'</div><div class="val">'+(w&&w.v!=null?esc(c.fmt(w.v)):'')+'</div></div>'});
  h+='</section>';

  // 2. where am I
  h+='<div class="find"><input id="find" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type your TikTok @ to see your rank" value="'+esc(ui.find)+'"><div id="meBox">'+meHtml(day,me,R)+'</div></div>';

  // 3. one tap for more
  h+='<button class="more cap" id="moreBtn" aria-expanded="'+ui.open+'">'+(ui.open?"Hide details":"See top 10 and past winners")+'</button>';
  if(ui.open)h+=detailHtml(day,me,past);

  h+='<p class="rules">Post the <b>Instant Premium Jersey Hijab</b>, tag it and add it to your showcase.<br>Each round runs 10am to 10am Eastern. New winners every day.'+(state.updatedAt?'<br>Updated '+esc(ago(state.updatedAt))+'.':'')+'</p>';

  if(MODE==="admin"&&ui.isOwner)h+=adminHtml(yday);
  h+='</main>';
  var hadFocus=document.activeElement&&document.activeElement.id;
  document.getElementById("app").innerHTML=h;
  bind();
  if(hadFocus==="find"){var f=document.getElementById("find");f.focus();var L=f.value.length;try{f.setSelectionRange(L,L)}catch(e){}}
}
function ago(iso){var m=Math.round((Date.now()-new Date(iso).getTime())/60000);if(m<1)return "just now";if(m<60)return m+" min ago";var h=Math.round(m/60);return h<48?h+" h ago":Math.round(h/24)+" days ago"}

function meHtml(day,me,R){
  if(!me)return "";
  if(!R[me])return '<div class="me">@'+esc(me)+' isn’t in the competition yet. Ask in the WhatsApp group.</div>';
  if(!started())return '<div class="me">You’re in. The race starts at 10am Eastern.</div>';
  var bits=CATS.map(function(c){var s=scores(c.key,day),i=-1;s.forEach(function(r,j){if(r.h===me)i=j});return '<b>'+esc(c.label)+':</b> '+(i>=0?'#'+(i+1)+' ('+esc(c.fmt(s[i].v))+')':'not ranked yet')});
  return '<div class="me">'+bits.join('<br>')+'</div>';
}

/* top-performers chart: one metric, one period, top 5 as bars */
var PERIODS=[{key:"day",label:"Today"},{key:"week",label:"This week"},{key:"month",label:"This month"}];
function periodDays(day,p){
  var out=[],d=state.startDate;
  var a=day.split("-").map(Number),dt=new Date(Date.UTC(a[0],a[1]-1,a[2],12));
  var from=day;
  if(p==="week"){var dow=(dt.getUTCDay()+6)%7;from=addDay(day,-dow)}
  if(p==="month"){from=day.slice(0,8)+"01"}
  while(d<=day){if(d>=from)out.push(d);d=addDay(d,1)}
  return out;
}
function periodScores(cat,day,p){
  var m={};periodDays(day,p).forEach(function(d){scores(cat,d).forEach(function(r){m[r.h]=(m[r.h]||0)+r.v})});
  return Object.keys(m).map(function(h){return {h:h,v:m[h]}}).sort(function(a,b){return b.v-a.v||a.h.localeCompare(b.h)});
}
function chartHtml(day,me){
  var c=CATS.filter(function(x){return x.key===ui.metric})[0]||CATS[0];
  var all=periodScores(c.key,day,ui.period),top=all.slice(0,10),max=top.length?top[0].v:0;
  var meIdx=-1;all.forEach(function(r,i){if(r.h===me)meIdx=i});
  var seg=function(list,cur,attr){return '<div class="seg" role="group">'+list.map(function(o){return '<button class="'+(o.key===cur?"on":"")+'" data-'+attr+'="'+o.key+'" aria-pressed="'+(o.key===cur)+'">'+esc(o.label)+'</button>'}).join("")+'</div>'};
  var h='<div class="list"><h3 class="cap">Top 10 performers</h3>'+seg(PERIODS,ui.period,"per")+seg(CATS.map(function(x){return {key:x.key,label:x.label.replace(/^(Top|Most|Best) /,"")}}),c.key,"met");
  if(!top.length)h+='<div class="bars-empty">No results yet for this period.</div>';
  else{
    h+='<ol class="bars">'+top.map(function(r,i){return '<li'+(r.h===me?' class="me-row"':'')+'><div class="bar-top"><span class="n">'+(i+1)+'. @'+esc(r.h)+'</span><span class="v">'+esc(c.fmt(r.v))+'</span></div><div class="track"><i style="width:'+Math.max(4,r.v/max*100)+'%"></i></div></li>'}).join("")+'</ol>';
    if(meIdx>=10)h+='<div class="bars-me">You: #'+(meIdx+1)+' · '+esc(c.fmt(all[meIdx].v))+'</div>';
  }
  return h+'</div>';
}
function detailHtml(day,me,past){
  var h='<div class="detail">';
  if(started())h+=chartHtml(day,me);
  h+='<div class="list"><h3 class="cap">Past winners</h3>'+(past.length?'<div class="scroll"><table class="past"><thead><tr><th>Day</th>'+CATS.map(function(c){return '<th>'+esc(c.label)+'</th>'}).join("")+'</tr></thead><tbody>'+past.map(function(d){return '<tr><td>'+esc(fmtDay(d))+'</td>'+CATS.map(function(c){var w=winner(c.key,d);return '<td>'+(w?'@'+esc(w.h):'—')+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>':'<div class="empty" style="color:var(--muted);font-size:14px;padding:10px 0;border-top:1px solid var(--ink)">The first winners are posted after Nov 1.</div>')+'</div>';
  return h+'</div>';
}

function winnersMessage(d){
  if(!d)return "";
  var lines=["🏆 VOILE CHIC WINNERS · "+fmtDay(d,true),""];
  CATS.forEach(function(c){var w=winner(c.key,d);lines.push(c.emoji+" "+c.label+": "+(w?"@"+w.h+(w.v!=null&&c.key!=="helper"?" ("+c.fmt(w.v)+")":""):"no winner"))});
  lines.push("","$20 each. Congrats! 🎉","New day, new chance. Post your Instant Premium Jersey Hijab video today.","","Your rank: "+PUBLIC_URL);
  return lines.join("\n");
}
function adminHtml(yday){
  var t=today(),hday=ui.hday||(started()?t:state.startDate);ui.hday=hday;
  var Rl=(state.roster||[]).map(function(r){return norm(r.handle)}).sort();
  var hp=((state.daily||{})[hday]||{}).helper||{},w=(state.winners||{})[hday]||{};
  var days=[];var d=state.startDate,last=started()?t:state.startDate;while(d<=last){days.push(d);d=addDay(d,1)}
  var h='<section id="admin" aria-label="Team controls"><h2 class="cap">Team controls · only you see this</h2>';
  // winners message
  h+='<div class="blk"><h2 class="cap">Daily winners message</h2>'+(yday?'<p>Ready for the WhatsApp group. Copy and paste.</p><div class="msg" id="msgTxt">'+esc(winnersMessage(yday))+'</div><button class="btn cap" id="copyBtn">'+(ui.copied?"Copied":"Copy message")+'</button>':'<p>Appears here after the first day closes.</p>')+'</div>';
  // creators
  h+='<div class="blk"><h2 class="cap">Creators in the competition ('+Rl.length+')</h2><p>Paste TikTok handles from the WhatsApp group. Commas or new lines both work.</p><div class="row"><input class="field" id="addH" type="text" autocomplete="off" placeholder="@name1, @name2"><button class="btn cap" id="addBtn">Add</button></div><div class="chips">'+Rl.map(function(k){return '<span class="chip">@'+esc(k)+'<button data-rm="'+esc(k)+'" aria-label="Remove @'+esc(k)+'">×</button></span>'}).join("")+'</div></div>';
  // helper + winners
  h+='<div class="blk"><h2 class="cap">Helper points and winners</h2><label class="ws">Day<select class="field" id="hday">'+days.slice().reverse().map(function(x){return '<option value="'+x+'"'+(x===hday?" selected":"")+'>'+esc(fmtDay(x,true))+'</option>'}).join("")+'</select></label>'+
     (Rl.length?Rl.map(function(k){return '<label class="hp" for="hp_'+esc(k)+'"><span>@'+esc(k)+'</span><input class="field" type="number" min="0" step="1" id="hp_'+esc(k)+'" data-hp="'+esc(k)+'" value="'+(hp[k]||"")+'" placeholder="0"></label>'}).join(""):'<p>Add creators first.</p>')+
     CATS.map(function(c){return '<label class="ws" for="w_'+c.key+'">'+esc(c.label)+' winner<select class="field" id="w_'+c.key+'" data-win="'+c.key+'"><option value="">Automatic (from rankings)</option>'+Rl.map(function(k){return '<option value="'+esc(k)+'"'+(norm(w[c.key])===k?" selected":"")+'>@'+esc(k)+'</option>'}).join("")+'</select></label>'}).join("")+'</div>';
  h+='<div class="row"><button class="btn cap" id="saveBtn"'+(ui.saving?" disabled":"")+'>'+(ui.saving?"Saving…":"Save changes")+'</button></div><div class="save-msg" role="status">'+esc(ui.msg)+'</div>';
  // videos for the team
  var vids=(state.videos||[]).filter(function(v){return v.postedAt&&compDay(new Date(v.postedAt))===hday}).sort(function(a,b){return (b.views||0)-(a.views||0)});
  h+='<div class="blk"><h2 class="cap">Videos posted '+esc(fmtDay(hday,true))+' ('+vids.length+')</h2>'+(vids.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Creator</th><th class="r">Views</th><th class="r">Sales</th><th></th></tr></thead><tbody>'+vids.map(function(v){return '<tr><td>@'+esc(norm(v.handle))+'</td><td class="r">'+count(v.views)+'</td><td class="r">'+money(v.gmv)+'</td><td>'+(v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">Watch</a>':'')+'</td></tr>'}).join("")+'</tbody></table></div>':'<p>None yet.</p>')+'</div>';
  return h+'</section>';
}

function bind(){
  var f=document.getElementById("find");
  if(f)f.oninput=function(){ui.find=f.value;try{localStorage.setItem("vc_find",f.value)}catch(e){}var me=norm(f.value),day=started()?today():state.startDate;document.getElementById("meBox").innerHTML=meHtml(day,me,roster());if(ui.open)render()};
  var mb=document.getElementById("moreBtn");if(mb)mb.onclick=function(){ui.open=!ui.open;render()};
  Array.prototype.forEach.call(document.querySelectorAll("[data-per]"),function(b){b.onclick=function(){ui.period=b.getAttribute("data-per");render()}});
  Array.prototype.forEach.call(document.querySelectorAll("[data-met]"),function(b){b.onclick=function(){ui.metric=b.getAttribute("data-met");render()}});
  if(MODE!=="admin"||!ui.isOwner)return;
  var cb=document.getElementById("copyBtn");if(cb)cb.onclick=function(){var txt=document.getElementById("msgTxt").textContent;var done=function(){ui.copied=true;render();setTimeout(function(){ui.copied=false;render()},2000)};try{navigator.clipboard.writeText(txt).then(done,function(){selectMsg()})}catch(e){selectMsg()}};
  var add=document.getElementById("addBtn"),inp=document.getElementById("addH");
  function doAdd(){collect();var have=roster();(inp.value||"").split(/[,\s]+/).map(norm).filter(Boolean).forEach(function(k){if(!have[k]){state.roster.push({handle:k,added:today()});have[k]=1}});ui.msg="Not saved yet. Press Save changes.";render()}
  if(add)add.onclick=doAdd;if(inp)inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();doAdd()}};
  Array.prototype.forEach.call(document.querySelectorAll("[data-rm]"),function(b){b.onclick=function(){collect();var k=b.getAttribute("data-rm");state.roster=state.roster.filter(function(r){return norm(r.handle)!==k});ui.msg="Not saved yet. Press Save changes.";render()}});
  var hd=document.getElementById("hday");if(hd)hd.onchange=function(){collect();ui.hday=hd.value;render()};
  var sv=document.getElementById("saveBtn");if(sv)sv.onclick=doSave;
}
function selectMsg(){var el=document.getElementById("msgTxt");if(!el)return;var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);ui.msg="Copy didn’t work here. The message is selected: copy it with your keyboard or long-press."}
function collect(){
  if(!document.getElementById("admin"))return;
  var d=ui.hday;state.daily=state.daily||{};state.daily[d]=state.daily[d]||{};
  var hp={};Array.prototype.forEach.call(document.querySelectorAll("[data-hp]"),function(i){var v=Number(i.value);if(v>0)hp[i.getAttribute("data-hp")]=v});state.daily[d].helper=hp;
  state.winners=state.winners||{};var w=state.winners[d]||{};
  Array.prototype.forEach.call(document.querySelectorAll("[data-win]"),function(s){var k=s.getAttribute("data-win");if(s.value)w[k]=s.value;else delete w[k]});
  if(Object.keys(w).length)state.winners[d]=w;else delete state.winners[d];
}
function buildDoc(){
  var head=document.head.querySelector("style"),reset=head?head.textContent:"";
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var app=document.getElementById("appjs").textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>Voile Chic Creator Board</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">\n'+
    '<style id="css">'+document.getElementById("css").textContent+'</style>\n\n<div id="app"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="appjs">'+app+'<\/script>\n</body></html>';
}
function doSave(){
  if(!ui.artifact){ui.msg="Saving isn’t available in this view. Open the board from your Claude account.";render();return}
  collect();ui.saving=true;ui.msg="";render();
  ui.artifact.publish(buildDoc()).then(function(){ui.saving=false;ui.msg="Saved. The public site picks this up at the next hourly sync.";render()},function(err){ui.saving=false;var c=err&&err.code;ui.msg=c==="conflict"?"The board was updated at the same moment and reloaded. Make your change again.":(c==="not_granted"||c==="not_writer")?"Only the board owner can save.":"Couldn’t save. Try again in a minute.";render()});
}

function load(){fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){if(d&&typeof d==="object"){state=d;state.roster=state.roster||[];render()}}).catch(function(){})}
render();
setInterval(function(){var el=document.getElementById("tm");if(el)el.textContent=hm(started()?secsToMidnight():secsToStart())},20000);
if(MODE==="public"){load();setInterval(function(){if(!(document.activeElement&&document.activeElement.id==="find"))load()},5*60*1000)}
if(MODE==="admin"&&window.claude&&window.claude.use){
  window.claude.use("user").then(function(u){return u&&u.isOwner?u.isOwner():false}).then(function(o){if(o){ui.isOwner=true;render()}}).catch(function(){});
  window.claude.use("artifact").then(function(a){ui.artifact=a||null}).catch(function(){});
}
})();
</script>
</body>
</html>
